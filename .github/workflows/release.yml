name: Release

# Builds watchapp + companion and publishes both to one GitHub Release.
# Runs when VERSION changes on master, when this workflow changes, or manually.
on:
  push:
    branches: [master]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Read and validate VERSION
        id: version
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          V="${V#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid VERSION: '$V'" >&2
            exit 1
          fi
          PJ="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$PJ" != "$V" ]]; then
            echo "package.json version ($PJ) != VERSION ($V). Run scripts/sync-version.sh" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V (tag v$V)"

  pebble:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            make \
            python3 \
            python3-venv \
            python3-pip \
            nodejs \
            npm

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Cache Pebble SDK + pebble-tool
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/pebble-sdk
            ~/.local/share/uv
            ~/.local/bin
          key: pebble-sdk-${{ runner.os }}-v2

      - name: Install pebble-tool and SDK
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install pebble-tool --python 3.13
          command -v pebble
          # Ensure a usable SDK + ARM toolchain (cache may be incomplete).
          TOOLCHAIN="$HOME/.local/share/pebble-sdk/SDKs/current/toolchain/arm-none-eabi/bin/arm-none-eabi-gcc"
          if [ ! -x "$TOOLCHAIN" ]; then
            echo "SDK/toolchain missing — installing latest SDK"
            pebble sdk install latest
          fi
          test -x "$TOOLCHAIN"
          pebble --version
          pebble sdk list
          ls -la "$HOME/.local/share/pebble-sdk/SDKs/current/toolchain/arm-none-eabi/bin" | head

      - name: Build watchapp
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export PATH="$HOME/.local/share/pebble-sdk/SDKs/current/toolchain/arm-none-eabi/bin:$PATH"
          pebble clean || true
          pebble build
          echo "Build tree:"
          ls -la build/ || true
          ls -la build/*.pbw

      - name: Stage PBW
        run: |
          set -euo pipefail
          PBW="$(ls -1 build/*.pbw | head -n 1)"
          test -n "$PBW"
          test -f "$PBW"
          cp "$PBW" "EZ_SOS-${{ needs.version.outputs.version }}.pbw"
          ls -la "EZ_SOS-${{ needs.version.outputs.version }}.pbw"

      - name: Upload PBW artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-pbw
          path: EZ_SOS-${{ needs.version.outputs.version }}.pbw
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EZ_SOS_AUTH_KEY: ${{ secrets.EZ_SOS_AUTH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EZ_SOS_AUTH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create secrets with: ./scripts/create-android-release-keystore.sh --upload" >&2
            echo "Also set GitHub secret EZ_SOS_AUTH_KEY (64 hex chars) for SOS auth tokens." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/ezsos-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EZ_SOS_AUTH_KEY: ${{ secrets.EZ_SOS_AUTH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PATH:-}"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Stage APK
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk \
            "EZ_SOS-companion-${{ needs.version.outputs.version }}.apk"
          ls -la "EZ_SOS-companion-${{ needs.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: EZ_SOS-companion-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  publish:
    needs: [version, pebble, android]
    runs-on: ubuntu-latest
    # Only publish from master pushes / manual runs (not fork PRs).
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download PBW
        uses: actions/download-artifact@v7
        with:
          name: release-pbw
          path: dist

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: EZ SOS ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/EZ_SOS-${{ needs.version.outputs.version }}.pbw
            dist/EZ_SOS-companion-${{ needs.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
